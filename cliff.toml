# git-cliff 配置：精简 Keep a Changelog 风格的发布日志。
# 参考文档：https://git-cliff.org/docs/configuration

# 设计目标
# 1. 只有用户可感知的变更（Feature / Fix / 重构 / 性能 / 文档）进入 CHANGELOG；
# 2. 屏蔽内部噪音（CI 搭建、测试批量提交、依赖升级、构建工具链、代码风格等），
#    这些 commit 对最终用户没有参考价值，只会让发布日志变得冗长难读；
# 3. breaking change 通过行内 "(breaking)" 标记突出显示，不单独开章节；
# 4. 运行方式不变：`npm run changelog`（即 `git-cliff -o CHANGELOG.md`）。

[changelog]
# 文件头，遵循 Keep a Changelog 约定。
header = """
# Changelog
All notable changes to this project will be documented in this file.

"""
# 正文模板：先按版本（version）分组，再按语义分组（group）。
# - {{ commit.message | split(pat="\\n") | first | trim }}：取提交信息第一行并去掉首尾空白；
# - {{ commit.scope }}：保留 conventional commit 的 scope（如 fix(a11y) 中的 a11y）；
# - {{ commit.breaking }}：为真时渲染 "(breaking)" 前缀，突出破坏性变更。
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.breaking %}(breaking) {% endif %}{% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\\n") | first | trim }}
{% endfor %}
{% endfor %}
"""
# 折叠连续空行为单个空行，保持输出干净。
trim = true
# 生成器标识（用于识别日志来源）。
footer = """
<!-- Generated by git-cliff -->
"""

[git]
# 启用 Conventional Commits 解析：提取 type / scope。
conventional_commits = true
# 丢弃不符合 Conventional Commits 规范的提交（如 "Initial release" 这类无前缀提交）。
filter_unconventional = true
# 不拆分多次提交，保持每条提交一行。
split_commits = false
# 按语义类型归组；未命中用户可感知类别的内部类型一律 skip（在 filter_commits=true 下会从输出中剔除）。
commit_parsers = [
  { message = "^feat", group = "New features" },
  # 基础设施领域的配置性修复（CI/测试/依赖/构建/发布脚本等）对用户无感知，屏蔽。
  { message = "^fix\\((ci|test|deps|build|release|scripts|security|knip|jscpd|readme|gitleaks|tooling)\\):", skip = true },
  { message = "^fix", group = "Bug fixes" },
  { message = "^refactor|^perf", group = "Refactoring & performance" },
  { message = "^doc", group = "Documentation" },
  # 内部噪音类型（test/ci/build/chore/deps/revert/style/security）全部屏蔽。
  { message = "^test|^ci|^build|^chore|^deps|^revert|^style|^security", skip = true },
  # 其余无法归类到用户可感知类别的提交也忽略。
  { message = ".*", skip = true },
]
# 破坏性提交不单独放大版本，仅用行内 (breaking) 标记标注。
protect_breaking_commits = false
# 命中 skip=true 的提交会被从输出中过滤掉。
filter_commits = true
# 只处理形如 v0.1.0 的版本标签。
tag_pattern = "v[0-9].*"
# 组内提交按时间从旧到新排列，保证日志稳定可复现。
sort_commits = "oldest"

[remote]
# 关闭远程元数据（git-cliff 尝试拉取 PR 链接等网络数据），保证离线可复现。
enable = false