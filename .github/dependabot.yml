version: 2
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: chore(deps)
    # Two majors are held back on purpose. Without these rules Dependabot
    # re-opens the same declined PR every week (it did in September 2026:
    # PR #49 for jsdom and the grouped PR #59 that bundled ESLint 10).
    # Security updates are unaffected by this block, so a real advisory in
    # either package still gets a PR.
    ignore:
      # ESLint 10 needs a flat-config + typescript-eslint pairing decision first.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # jsdom 30 breaks Radix Select interactions and leaks state across test
      # files; see src/test/setup.ts.
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react*'
      radix:
        patterns:
          - '@radix-ui/*'
      tauri:
        patterns:
          - '@tauri-apps/*'
      dev:
        patterns:
          - '@vitejs/*'
          - '@testing-library/*'
          - 'eslint*'
          - typescript-eslint
          - vitest
          - '@playwright/*'

  # Rust dependencies
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: chore(deps)

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(deps)
