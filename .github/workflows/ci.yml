name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Explicit least privilege. Without this block every job inherits the repository
# default token scope, so a new step could write without anyone deciding that.
# Values checked against actual use: `contents: read` for actions/checkout,
# `pull-requests: read` because gitleaks-action calls GET /pulls/{n}/commits.
# No job writes — upload-artifact authenticates through ACTIONS_RUNTIME_TOKEN and
# is unaffected by this block.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep in sync with the channel in rust-toolchain.toml. CI used to ask for
  # `stable` here, which silently outranks that file: dtolnay/rust-toolchain
  # exports RUSTUP_TOOLCHAIN, and that env var beats rust-toolchain.toml.
  RUST_TOOLCHAIN: '1.98.1'

jobs:
  # Pinned to ubuntu-24.04 rather than ubuntu-latest: `latest` resolves to 24.04
  # today and GitHub moves it to 26.04 on 2026-10-19, which would change every
  # job's environment in a commit that did not ask for it. Naming the image keeps
  # that move a deliberate decision. The Linux build matrix stays on ubuntu-22.04
  # on purpose, for the older glibc and webkit2gtk the bundle needs.
  #
  # Every job below carries an explicit `timeout-minutes`. Without one, a hung
  # step holds a runner until GitHub's six-hour ceiling and the PR shows no
  # signal at all. The caps sit well above the slowest observed run on purpose:
  # a too-tight timeout manufactures red CI and trains people to ignore it.
  workflow-lint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1.7.12

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      # 文档防回潮护栏：格式一致性 + 双语配对/互链 + 外部链接可达性。
      # 三项互相独立，失败会阻断合并，避免文档在精简后被悄然带偏。
      - name: markdownlint (format consistency)
        run: npm run docs:lint

      - name: en/zh pair & cross-link check
        run: npm run docs:pairs

      - name: URL link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml 'docs/**/*.md' 'README.md' 'README.zh.md'

  # Runs alongside docs and workflow-lint: a failure here is a signal to act on,
  # not a reason to stop compiling or testing the change under review.
  security-audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    # Longest cap in the file: cargo-binstall itself is compiled from source
    # before binstall can download the audit tools.
    timeout-minutes: 45
    steps:
      # gitleaks-action scans `HEAD^..HEAD` on pull_request events; a shallow
      # checkout (fetch-depth: 1) has no parent commit, so fetch full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=moderate

      - name: npm audit (devDependencies)
        # Not a bare `npm audit --audit-level=high`: braces has no patched
        # release, and npm would mark its whole dependents chain high.
        # scripts/check-audit.mjs carries the documented exemption.
        run: node scripts/check-audit.mjs

      - name: npm license check
        # Both spellings of the Python license are allowed because argparse
        # reports its license as "Python-2.0" at 2.0.1 and "PSF-2.0" at 3.0.2,
        # which markdown-it 15 pulls in. Same permission set, different SPDX
        # identifier; neither entry widens what the gate accepts.
        run: 'npx --yes license-checker --summary --excludePrivatePackages --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;MPL-2.0;CC0-1.0;Unlicense;Zlib;0BSD;WTFPL;Python-2.0;PSF-2.0;BlueOak-1.0.0;BSD-3-Clause-Clear;MIT OR Apache-2.0;Apache-2.0 OR MIT;Apache-2.0 AND MIT;MIT-0;FSL-1.1-MIT;CC-BY-4.0;Custom: https://github.com/streetsidesoftware/cspell"'

      - name: Secret leak scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Install cargo-binstall once (compiled), then use prebuilt binaries
      # for the audit tools — cargo install X --locked recompiles each tool
      # from source on every CI run (10-20 min), binstall downloads instead.
      - name: Install cargo-binstall
        run: cargo install cargo-binstall --locked

      - name: Install cargo-audit
        run: cargo binstall --no-confirm cargo-audit

      - name: Rust security audit
        working-directory: src-tauri
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0235

      - name: Install cargo-deny
        run: cargo binstall --no-confirm cargo-deny

      - name: Rust dependency audit (cargo-deny)
        working-directory: src-tauri
        run: cargo deny check

  quality:
    name: Code Quality
    # No `needs: security-audit`. Compliance checks report their result; they must
    # not gate the correctness checks. With that edge in place, one advisory whose
    # upstream has no patched release (braces GHSA-vfj7-8cjw-p6xm) marked Security
    # Audit red, which skipped Code Quality, E2E and all three platform builds, and
    # also stopped the cargo-deny step behind it in the same job from ever running.
    # The whole verification suite was silently off for six weeks.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Spell check (cspell)
        run: npm run cspell:check

      - name: Prettier format check
        run: npm run format:check

      - name: i18n catalog consistency
        run: npm run i18n:check

      - name: Gate scripts self-test
        # The custom guards in scripts/ are the ones that decide whether an
        # advisory is exempted and whether coverage moved. A guard with a broken
        # comparison passes forever and looks exactly like a guard that is
        # working, so they need tests of their own — one of them shipped with a
        # severity comparison against an undefined rank, which made it accept
        # every input including a genuinely vulnerable tree.
        # Runs before the suites it watches: if a gate is inert, its verdicts are
        # the ones worth failing on first.
        run: npm run test:scripts

      - name: Production build
        run: npm run build

      - name: Bundle size and artifact budget
        # Nothing else in this pipeline measures what a user downloads. A
        # dependency bump that adds 90 kB of gzip is one lockfile line in review,
        # and a small artifact is the reason to pick Tauri at all. The step also
        # proves React Compiler ran: the babel preset accepts its option whether
        # or not the plugin resolves, so a silent no-op builds green.
        run: npm run bundle:check

      - name: Frontend unit tests with coverage
        run: npm run test:coverage

      - name: Coverage register guard (--check-only)
        run: node scripts/check-coverage.mjs --check-only

      - name: README test counts up to date
        run: npm run readme:check

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Dead code detection (knip)
        run: npm run knip

      - name: Duplicate code detection (jscpd)
        run: npm run jscpd

      - name: Architecture rules (ast-grep)
        run: npm run ast:lint

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install Rust nightly (for branch coverage)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Install cargo-binstall once, then use prebuilt binaries (see
      # security-audit job for the rationale).
      - name: Install cargo-binstall
        run: cargo install cargo-binstall --locked

      - name: Install cargo-llvm-cov
        run: cargo binstall --no-confirm cargo-llvm-cov

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Install cargo-machete
        run: cargo binstall --no-confirm cargo-machete

      - name: Rust unused dependencies (cargo-machete)
        working-directory: src-tauri
        run: cargo machete

      # Regenerate TS bindings and fail if they drifted from the committed
      # src/lib/bindings.ts. Catches the "edited a Rust command but forgot
      # npm run rust:bindings" failure mode before it reaches typecheck.
      - name: Regenerate TypeScript bindings (drift guard)
        working-directory: src-tauri
        run: cargo test export_bindings -- --ignored --nocapture

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Rust coverage report
        working-directory: src-tauri
        run: |
          mkdir -p ../coverage
          cargo +nightly llvm-cov --branch --text --output-path ../coverage/rust-coverage.txt --fail-under-lines 75

      - name: Upload Rust coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage-report
          path: coverage/rust-coverage.txt
          retention-days: 30

      - name: Verify clean worktree
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean after CI steps. Run formatting/lint fixes or regenerate bindings locally."
            git status --porcelain
            git diff
            exit 1
          fi

  e2e:
    name: E2E Tests
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    name: Build (${{ matrix.platform }})
    needs: [quality, e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      # CI 验证只编译 Rust + 前端，不生成安装包。
      # 完整 bundle 需要 TAURI_SIGNING_PRIVATE_KEY（updater.pubkey 已配置），
      # 该密钥仅在 release 流水线中提供。使用 --no-bundle 跳过签名步骤，
      # 同时仍能验证跨平台编译是否通过。
      - name: Build Tauri app (compile check)
        run: npx tauri build --no-bundle

      - name: Verify the native binary was produced
        # The suite says nothing about the shell. 97 Playwright cases run against
        # the frontend dev server with a mocked IPC layer, and the Rust tests never
        # open a window, so before this step nothing in CI proved that a native
        # executable came out of the build at all.
        #
        # A driver-driven smoke was considered and rejected: `tauri-driver` drives
        # Windows and Linux only — the upstream docs state macOS has no WKWebView
        # driver tool — so it could never cover the three platforms this template
        # builds for, and a "desktop smoke" that silently omits macOS is the kind
        # of gate whose coverage is a fiction. This assertion is the part that can
        # be true everywhere: the binary exists, and its size is recorded per
        # platform so a jump becomes visible in the job summary.
        shell: bash
        run: |
          set -euo pipefail
          binary=$(find src-tauri/target/release -maxdepth 1 -type f \
            \( -name 'tauri-desktop-software-template' -o -name 'tauri-desktop-software-template.exe' \) \
            -print -quit)
          if [ -z "${binary}" ]; then
            echo "::error::tauri build --no-bundle produced no release binary"
            exit 1
          fi
          size=$(wc -c < "${binary}" | tr -d ' ')
          echo "release binary: ${binary} (${size} bytes)"
          {
            echo "### Binary size — ${matrix_platform}"
            echo ""
            echo "\`${binary}\`: ${size} bytes"
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          matrix_platform: ${{ matrix.platform }}

  # One stable name for the whole platform matrix.
  #
  # The `protect-main` configuration on the remote currently requires three
  # separate contexts, `Build (ubuntu-22.04)`, `Build (windows-latest)` and
  # `Build (macos-latest)`, which burns runner image labels into cloud state. A
  # matrix edit then needs a matching cloud edit, and forgetting one does not
  # produce a red check: the required context never reports, so every pull
  # request sits pending with no failure to read. Moving the platforms behind
  # this job means image changes stay inside the file that declares them.
  #
  # `if: always()` is load-bearing: without it a failed `build` skips this job,
  # and a skipped required check is the same never-reports failure mode.
  #
  # Unlike the upstream reference this project has no deliberately-skipped
  # matrix, so `skipped` here can only mean an earlier gate stopped the run.
  # That reports red rather than green — the six-week silent outage above is why
  # passing on a skip is not an option.
  build-summary:
    name: Build (all platforms)
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check matrix result
        env:
          MATRIX_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::build result is '$MATRIX_RESULT', expected 'success'. A value of 'skipped' means an earlier gate (quality or e2e) stopped the run — the platform matrix has produced no verdict at all."
            exit 1
          fi
          echo "All platform builds passed."
