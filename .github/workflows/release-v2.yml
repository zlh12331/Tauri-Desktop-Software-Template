name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

# Two runs of the same tag must not overlap. `finalize` deletes and recreates a
# draft release, and it does so with `gh release delete ... || true`, so a
# superseded run that finishes late can pull the draft out from under the current
# one. Keyed on github.ref, which is the tag ref for a tag push, so distinct
# versions still build in parallel. Never cancel mid-release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege as the default. Jobs that need to write say so themselves
# (`bump-version`, `publish-tauri`, `finalize` each carry `contents: write`);
# `quality` only reads, builds and compares CHANGELOG text, so it inherits read.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep in sync with the channel in rust-toolchain.toml (and with ci.yml).
  RUST_TOOLCHAIN: '1.98.1'
  # One pin for both jobs that touch git-cliff. `quality` byte-compares the
  # CHANGELOG that `bump-version` commits, so two different versions of the
  # generator would fail the release for a reason no one can see in the diff.
  GIT_CLIFF_VERSION: '2.14.1'

jobs:
  # Manual dispatch only: bump the four version fields, update CHANGELOG, push
  # `release/vX` and open a pull request. It does not tag — `main` is protected,
  # and the tag belongs to the merge. Once the pull request is merged, run
  # `npm run release:tag -- vX`, and that tag push starts the build path below.
  bump-version:
    name: Bump version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      # The release step opens a pull request with gh instead of pushing to the
      # protected `main`; without this the API call is refused and the job dies
      # after it has already committed.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # `npm run release:prepare` regenerates CHANGELOG.md through the git-cliff
      # binary, which is not preinstalled on runners. Without this the dispatch
      # path bumps the versions, then dies at the changelog step with the branch
      # already committed locally — a failure that looks like a script bug.
      - name: Install git-cliff (pinned)
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          cp "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      # prepare-release.js --non-interactive now runs check:all, bumps the four
      # version files, regenerates the changelog, and pushes `release/vX` and
      # opens a pull request. It no longer tags: `npm run release:tag -- vX` tags
      # the merge once that pull request lands, because `main` is protected and a
      # refused push that happens after `git tag` leaves a tag naming a commit
      # that never reached `main`.
      #
      # Two reasons this is `npm run`, not `node scripts/prepare-release.js`:
      # the script resolves npm through the npm_execpath variable, which exists
      # only inside an npm run context — so the previous form threw before
      # reaching check:all — and the version arrives via env, since interpolating
      # `${{ inputs.version }}` straight into a run: block is a documented
      # script-injection surface.
      - name: Prepare release (bump versions, changelog, open the release PR)
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:prepare -- "$VERSION" --non-interactive

  quality:
    name: Code Quality
    # ubuntu-24.04, unlike the Linux entry of the bundle matrix below: that one
    # stays on 22.04 for the older glibc and webkit2gtk the AppImage needs, while
    # this job only installs, tests and regenerates CHANGELOG text. It blocks the
    # release, so the cap sits above a full `check:all` plus cargo coverage.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Full history is required: `npm run changelog` runs git-cliff, which
      # groups commits by tag. A shallow checkout (fetch-depth: 1) hides all
      # ancestors, so the regenerated CHANGELOG would omit earlier entries and
      # fail the `git diff --exit-code` guard below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Spell check (cspell)
        run: npm run cspell:check

      - name: Prettier format check
        run: npm run format:check

      - name: i18n catalog consistency
        run: npm run i18n:check

      - name: Frontend unit tests with coverage
        run: npm run test:coverage

      # `npm run changelog` invokes the `git-cliff` binary, which is not
      # preinstalled on runners. The version comes from the workflow-level
      # GIT_CLIFF_VERSION so this job and `bump-version` cannot drift apart.
      - name: Install git-cliff (pinned)
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          cp "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: CHANGELOG up to date (git-cliff)
        run: |
          npm run changelog
          git diff --exit-code -- CHANGELOG.md

      - name: Rust fmt
        run: cd src-tauri && cargo fmt --check

      - name: Rust clippy
        run: cd src-tauri && cargo clippy -- -D warnings

      - name: Rust tests
        run: cd src-tauri && cargo test

      - name: Dead code detection (knip)
        run: npm run knip

      - name: Duplicate code detection (jscpd)
        run: npm run jscpd

      - name: Architecture rules (ast-grep)
        run: npm run ast:lint

  # 三平台并行：构建 → 重命名产物 → 上传为 Actions Artifact。
  # 刻意不用 tauri-action 直接发布，而是把"发布"集中到 finalize 作业统一处理，
  # 这样能：1) 把各平台安装包按 Windows/macOS/Linux 前缀重命名；
  #         2) 重建一份合并后的 latest.json（自更新清单，必须与新文件名一致）；
  #         3) 生成按平台分组、结构清晰的发布说明，避免 tauri-action 各平台互相覆盖 body。
  publish-tauri:
    name: Build & rename (${{ matrix.os }})
    needs: quality
    # A full signed bundle per platform, from a cold Rust cache on the first
    # release after a dependency bump. Generous on purpose: a release that dies
    # at a timeout loses its tag slot and has to be re-run end to end.
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macos
            args: --bundles app,dmg
          - platform: windows-latest
            os: windows
            args: --bundles msi
          - platform: ubuntu-22.04
            os: linux
            args: --bundles appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Windows code signing certificate
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "code-signing.pfx"
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)) | Out-File -FilePath $certPath -Encoding ASCII -NoNewline
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($certPath, $env:WINDOWS_CERTIFICATE_PASSWORD)
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My", "LocalMachine")
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()
          Write-Host "Certificate imported. Thumbprint: $($cert.Thumbprint)"
          echo "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Import macOS code signing certificate
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certPath="$RUNNER_TEMP/code-signing.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certPath"
          security create-keychain -p "tauri-keychain" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "tauri-keychain" build.keychain
          security import "$certPath" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "tauri-keychain" build.keychain
          # The bundler signs by identity *name*, so export the name and not a flag nobody
          # reads. `find-identity` prints:   1) <sha1> "Developer ID Application: X (TEAM)"
          identity=$(security find-identity -v -p codesigning build.keychain \
            | sed -n 's/.*"\(.*\)".*/\1/p' \
            | head -1)
          if [ -z "$identity" ]; then
            echo "::error::APPLE_CERTIFICATE was imported but holds no codesigning identity"
            exit 1
          fi
          echo "TAURI_MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # tauri-bundler 只读 tauri.conf.json 里的 bundle.macOS.signingIdentity 与
      # bundle.windows.certificateThumbprint，不读上面导出的环境变量。这一步就是那根
      # 缺失的接线：证书在场就把身份写进配置，不在场就一个字都不改。身份或指纹取不到
      # 时脚本直接失败，因为"配了证书却悄悄发出 ad-hoc 包"比发布失败糟糕得多。
      - name: Wire the certificate into the bundler config
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: node scripts/configure-code-signing.mjs

      # 直接调 tauri CLI 构建（非 tauri-action）。传入 updater 私钥用于生成
      # .sig 签名文件与各平台自己的 latest.json。macOS 无证书时会走 ad-hoc 签名。
      # 注意必须用 `npm run tauri -- build`：没有 `--` 分隔时 npm 会把
      # `--bundles appimage` 当成 npm 自己的参数吞掉，导致 tauri 收到裸的 `appimage`。
      - name: Build (tauri)
        run: npm run tauri -- build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}

      # 把安装包重命名为 `<产品名>-<平台>-<版本>-<架构>.<后缀>`，
      # 同时生成 rename-map.json 供 finalize 重建 latest.json 时做新旧文件名映射。
      # 注意：必须写成单行——Windows runner 默认 shell 是 PowerShell，`\` 不是续行符。
      - name: Rename release assets with platform label
        run: >-
          node scripts/release-assets.mjs rename
          ${{ matrix.os }}
          Tauri-Desktop-Software-Template
          ${{ github.ref_name || inputs.version }}

      # 把该平台的重命名产物作为独立 Actions Artifact 保存，交给 finalize 作业。
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error

      - name: Cleanup Windows certificate
        if: matrix.platform == 'windows-latest' && always()
        shell: pwsh
        run: |
          if (Test-Path (Join-Path $env:RUNNER_TEMP "code-signing.pfx")) {
            Remove-Item (Join-Path $env:RUNNER_TEMP "code-signing.pfx") -Force
          }

      - name: Cleanup macOS keychain
        if: matrix.platform == 'macos-latest' && always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true

  # 汇合作业：等待三个平台全部构建完成后，
  # 1) 下载各平台产物；2) 重建合并的 latest.json + 生成发布说明；
  # 3) 创建 draft release 并上传全部安装包/签名/latest.json。
  finalize:
    name: Finalize release
    needs: publish-tauri
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download macOS bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle-macos
          path: artifacts/macos

      - name: Download Windows bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle-windows
          path: artifacts/windows

      - name: Download Linux bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle-linux
          path: artifacts/linux

      # 汇总三平台产物：重建 latest.json（用重命名后的文件名）并生成 release-body.md。
      - name: Assemble latest.json and release body
        run: |
          node scripts/release-assets.mjs finalize \
            artifacts \
            '${{ github.ref_name || inputs.version }}' \
            '${{ github.repository_owner }}' \
            '${{ github.event.repository.name }}' \
            Tauri-Desktop-Software-Template \
            '${{ github.ref_name || inputs.version }}' \
            release-out \
            CHANGELOG.md

      # 分发完整性必须自己开口。缺证书是模板合理的缺省，但“合理”不等于“静默”：
      # 没有这一步，唯一的证据是某个 step 被 skip，而安装者读到的是一堆 ad-hoc 包。
      # 姿态同时写进发布说明与作业摘要，两者都是人会看的地方。
      - name: Declare code-signing posture
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          # Inline markdown code needs literal backticks, and a single-quoted string
          # carrying them is exactly what shellcheck flags as SC2016 (actionlint fails
          # the job even at info severity). A file-top `# shellcheck disable=SC2016`
          # was tried first and did not suppress it, so the strings are double-quoted
          # with the backticks and inner quotes escaped.
          set -euo pipefail
          note="$RUNNER_TEMP/sign-posture.md"
          {
            echo ''
            echo '## Code signing'
            echo ''
            if [ -n "$APPLE_CERTIFICATE" ]; then
              echo "- macOS: signed with the Developer ID identity wired into \`bundle.macOS.signingIdentity\` by \`scripts/configure-code-signing.mjs\`. A certificate that yields no usable identity fails the release instead of quietly shipping ad-hoc."
            else
              echo "- macOS: **ad-hoc signed** — no \`APPLE_CERTIFICATE\` secret. Gatekeeper blocks the first launch (\"cannot be opened because the developer cannot be verified\"); users need right-click then Open."
            fi
            if [ -n "$WINDOWS_CERTIFICATE" ]; then
              echo "- Windows: Authenticode-signed using the thumbprint wired into \`bundle.windows.certificateThumbprint\` by the same script; a certificate without a thumbprint fails the release."
            else
              echo "- Windows: **not Authenticode-signed** — no \`WINDOWS_CERTIFICATE\` secret. SmartScreen shows \"unknown publisher\" and requires More info then Run anyway."
            fi
            echo '- Linux: an AppImage has no OS-level signature to apply.'
            echo "- Auto-updater: \`latest.json\` and the \`.sig\` files are signed with \`TAURI_PRIVATE_KEY\`. That is a separate system from OS code signing and works either way."
          } > "$note"
          cat "$note" >> release-out/release-body.md
          cat "$note" >> "$GITHUB_STEP_SUMMARY"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 幂等：重跑/重试时清理同名旧 release（含草稿），避免冲突。
          gh release delete '${{ github.ref_name || inputs.version }}' --yes || true
          gh release create \
            '${{ github.ref_name || inputs.version }}' \
            --draft \
            --title "Tauri-Desktop-Software-Template ${{ github.ref_name || inputs.version }}" \
            --notes-file release-out/release-body.md

      # 上传全部安装包 + .sig 签名。文件清单由 finalize 脚本生成
      # （已排除 latest.json / rename-map.json / macOS 的 .app 应用包内部文件）。
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            test -n "$file" || continue
            gh release upload '${{ github.ref_name || inputs.version }}' "$file" --clobber
          done < release-out/upload-files.txt

      # 更新后的 latest.json 是自动更新的唯一入口，必须在最后单独上传。
      - name: Upload updated latest.json (updater manifest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload \
            '${{ github.ref_name || inputs.version }}' \
            release-out/latest.json \
            --clobber
