name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Manual dispatch only: bump the version in package.json / Cargo.toml /
  # tauri.conf.json, update CHANGELOG, commit and tag. Tag push then triggers
  # the normal build path below (push: tags v*) — this job exists so a human
  # can do the whole release from the Actions UI without touching a terminal.
  bump-version:
    name: Bump version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # prepare-release.js --non-interactive: runs check:all, bumps
      # package.json/Cargo.toml/tauri.conf.json, runs changelog, and executes
      # git add/commit/tag/push itself. The tag push triggers the normal
      # release build path below (push: tags v*).
      - name: Prepare release (bump versions, changelog, commit, tag)
        run: node scripts/prepare-release.js ${{ inputs.version }} --non-interactive

  quality:
    name: Code Quality
    runs-on: ubuntu-22.04
    steps:
      # Full history is required: `npm run changelog` runs git-cliff, which
      # groups commits by tag. A shallow checkout (fetch-depth: 1) hides all
      # ancestors, so the regenerated CHANGELOG would omit earlier entries and
      # fail the `git diff --exit-code` guard below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Spell check (cspell)
        run: npm run cspell:check

      - name: Prettier format check
        run: npm run format:check

      - name: i18n catalog consistency
        run: npm run i18n:check

      - name: Frontend unit tests with coverage
        run: npm run test:coverage

      # `npm run changelog` invokes the `git-cliff` binary, which is not
      # preinstalled on runners. Pin a fixed version (must match what the
      # maintainer used when generating the committed CHANGELOG.md, otherwise
      # the `git diff --exit-code` guard below fails on output drift).
      - name: Install git-cliff (pinned)
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          cp /tmp/git-cliff-2.13.1/git-cliff /usr/local/bin/git-cliff

      - name: CHANGELOG up to date (git-cliff)
        run: |
          npm run changelog
          git diff --exit-code -- CHANGELOG.md

      - name: Rust fmt
        run: cd src-tauri && cargo fmt --check

      - name: Rust clippy
        run: cd src-tauri && cargo clippy -- -D warnings

      - name: Rust tests
        run: cd src-tauri && cargo test

      - name: Dead code detection (knip)
        run: npm run knip

      - name: Duplicate code detection (jscpd)
        run: npm run jscpd

      - name: Architecture rules (ast-grep)
        run: npm run ast:lint

  # 三平台并行：构建 → 重命名产物 → 上传为 Actions Artifact。
  # 刻意不用 tauri-action 直接发布，而是把"发布"集中到 finalize 作业统一处理，
  # 这样能：1) 把各平台安装包按 Windows/macOS/Linux 前缀重命名；
  #         2) 重建一份合并后的 latest.json（自更新清单，必须与新文件名一致）；
  #         3) 生成按平台分组、结构清晰的发布说明，避免 tauri-action 各平台互相覆盖 body。
  publish-tauri:
    name: Build & rename (${{ matrix.os }})
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macos
            args: --bundles app,dmg
          - platform: windows-latest
            os: windows
            args: --bundles msi
          - platform: ubuntu-22.04
            os: linux
            args: --bundles appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Windows code signing certificate
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "code-signing.pfx"
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)) | Out-File -FilePath $certPath -Encoding ASCII -NoNewline
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($certPath, $env:WINDOWS_CERTIFICATE_PASSWORD)
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My", "LocalMachine")
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()
          Write-Host "Certificate imported. Thumbprint: $($cert.Thumbprint)"
          echo "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Import macOS code signing certificate
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certPath="$RUNNER_TEMP/code-signing.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certPath"
          security create-keychain -p "tauri-keychain" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "tauri-keychain" build.keychain
          security import "$certPath" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "tauri-keychain" build.keychain
          echo "APPLE_CERTIFICATE_IMPORTED=true" >> "$GITHUB_ENV"

      # 直接调 tauri CLI 构建（非 tauri-action）。传入 updater 私钥用于生成
      # .sig 签名文件与各平台自己的 latest.json。macOS 无证书时会走 ad-hoc 签名。
      - name: Build (tauri)
        run: npm run tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}

      # 把安装包重命名为 `<产品名>-<平台>-<版本>-<架构>.<后缀>`，
      # 同时生成 rename-map.json 供 finalize 重建 latest.json 时做新旧文件名映射。
      - name: Rename release assets with platform label
        run: |
          node scripts/release-assets.mjs rename \
            ${{ matrix.os }} \
            Tauri-Desktop-Software-Template \
            ${{ github.ref_name || inputs.version }}

      # 把该平台的重命名产物作为独立 Actions Artifact 保存，交给 finalize 作业。
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error

      - name: Cleanup Windows certificate
        if: matrix.platform == 'windows-latest' && always()
        shell: pwsh
        run: |
          if (Test-Path (Join-Path $env:RUNNER_TEMP "code-signing.pfx")) {
            Remove-Item (Join-Path $env:RUNNER_TEMP "code-signing.pfx") -Force
          }

      - name: Cleanup macOS keychain
        if: matrix.platform == 'macos-latest' && always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true

  # 汇合作业：等待三个平台全部构建完成后，
  # 1) 下载各平台产物；2) 重建合并的 latest.json + 生成发布说明；
  # 3) 创建 draft release 并上传全部安装包/签名/latest.json。
  finalize:
    name: Finalize release
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-macos
          path: artifacts/macos

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-windows
          path: artifacts/windows

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-linux
          path: artifacts/linux

      # 汇总三平台产物：重建 latest.json（用重命名后的文件名）并生成 release-body.md。
      - name: Assemble latest.json and release body
        run: |
          node scripts/release-assets.mjs finalize \
            artifacts \
            '${{ github.ref_name || inputs.version }}' \
            '${{ github.repository_owner }}' \
            '${{ github.event.repository.name }}' \
            Tauri-Desktop-Software-Template \
            '${{ github.ref_name || inputs.version }}' \
            release-out \
            CHANGELOG.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create \
            '${{ github.ref_name || inputs.version }}' \
            --draft \
            --title "Tauri-Desktop-Software-Template ${{ github.ref_name || inputs.version }}" \
            --notes-file release-out/release-body.md

      # 上传全部安装包 + .sig 签名（跳过内部清单文件）。
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find artifacts -type f \
            ! -name 'latest.json' \
            ! -name 'rename-map.json' \
            -print0 | while IFS= read -r -d '' file; do
              gh release upload '${{ github.ref_name || inputs.version }}' "$file" --clobber
          done

      # 更新后的 latest.json 是自动更新的唯一入口，必须在最后单独上传。
      - name: Upload updated latest.json (updater manifest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload \
            '${{ github.ref_name || inputs.version }}' \
            release-out/latest.json \
            --clobber
