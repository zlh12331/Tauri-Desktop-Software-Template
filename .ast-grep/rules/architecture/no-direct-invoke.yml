id: no-direct-invoke
message: |
  Never call raw Tauri `invoke()` — use the typed `commands` object from
  @/lib/tauri-bindings (generated by tauri-specta).

  BAD: import { invoke } from '@tauri-apps/api/core'
  GOOD: import { commands } from '@/lib/tauri-bindings'

  Raw invoke loses type safety and error-code contracts.
severity: error
language: TypeScript
files:
  - 'src/**/*.ts'
  - 'src/**/*.tsx'
ignores:
  # bindings.ts is the auto-generated typed wrapper — it is the ONLY place
  # allowed to call raw invoke (via the __TAURI_INVOKE alias).
  - 'src/lib/bindings.ts'
rule:
  any:
    - pattern: import { invoke } from '@tauri-apps/api/core'
    - pattern: import { invoke as $$$ALIAS } from '@tauri-apps/api/core'
    - pattern: import { invoke as $ALIAS } from '@tauri-apps/api/core'
note: |
  All Rust->frontend calls go through the typed `commands` from
  @/lib/tauri-bindings. AI code that reaches for raw invoke bypasses
  the type-safe Result/AppError contract. See docs/developer/tauri-commands.en.md.
