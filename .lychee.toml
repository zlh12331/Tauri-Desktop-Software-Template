# lychee link checker config.
# Runs in CI on the docs/ tree; scans markdown files for broken local & external links.
cache = false
# Four checked links point at tauri.app, and that same set passed one run while
# reporting 2 errors plus 2 timeouts the next. Retry more often, wait longer
# between attempts, and narrow the pool so one slow host is not amplified by
# eight simultaneous requests into a red main.
max_concurrency = 4
max_retries = 4
retry_wait_time = 5
# `timeout` is deliberately unset: lychee's default could not be confirmed from
# its docs or source, and a value below the default would make this gate stricter
# rather than steadier. Set it only against a measured default.

# Skip generated/private files that are not source-authored content.
exclude_path = ["CHANGELOG.md"]

# Allow patterns that lychee would otherwise flag (common false positives):
#   - localhost is only referenced as a dev-server example.
#   - git@ ssh refs and raw email addresses are intentionally not "websites".
exclude = [
  "http://localhost",
  "localhost:1420",
  "mailto:",
  "file://",
]

# Do not pull links out of fenced code blocks, so illustrative placeholders like
# `https://github.com/<your-username>/<your-repo>` are not treated as real URLs.
include_verbatim = false